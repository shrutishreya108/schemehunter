# 20 banned sentences (hi/en) the scanner must catch, 5 invented scheme names, and clean texts.
banned:
  - "Your loan is guaranteed."
  - "We guarantee the subsidy will come."
  - "This application will be approved next week."
  - "You will get ₹2 lakh subsidy."
  - "You will receive the money by March."
  - "Guaranteed approval for women entrepreneurs!"
  - "Don't worry, it will be approved."
  - "After this step you will get the loan."
  - "You will receive a sanction letter soon."
  - "There is a 100% guarantee on this."
  - "आपका लोन निश्चित है।"
  - "सब्सिडी पक्का मिलेगी।"
  - "इसकी गारंटी है कि पैसा आएगा।"
  - "आपको पैसा ज़रूर मिलेगा।"
  - "मंज़ूरी निश्चित रूप से मिलेगी।"
  - "यह लोन पक्का है, चिंता मत कीजिए।"
  - "हम गारंटी देते हैं।"
  - "आपको सब्सिडी ज़रूर मिलेगा।"
  - "Your PMEGP file will be approved."
  - "Mudra loan: you will get it in 10 days."
invented_schemes:
  - "You can also apply for the Mahila Udyam Shakti Yojana."
  - "Try the Rural Startup Booster Scheme next."
  - "The Karnataka Women Enterprise Mission gives grants."
  - "Ask the bank about the National Micro Credit Programme."
  - "आप नारी शक्ति उद्यम योजना के लिए भी आवेदन कर सकती हैं।"
clean:
  - "You qualify to apply for PMEGP. The bank will review your file."
  - "Dear Sir/Madam, on behalf of Meena Kumari, we request an update on PMEGP/KA/2026/04471."
  - "Your bank can apply for CGTMSE cover so the loan may not need collateral."
  - "The Credit Guarantee Fund Trust for Micro and Small Enterprises (CGTMSE) is something your bank applies for."
  - "आप प्रधानमंत्री मुद्रा योजना के लिए आवेदन कर सकती हैं।"
  - "Udyogini scheme office is in the district centre."
  - "Please upload your bank passbook photo."
