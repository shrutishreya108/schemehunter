{% extends "base.html" %}
{% block content %}
<h1>{{ t("pin_title") }}</h1>
<p class="muted">{{ t("pin_help") }}</p>
{% if locked %}<p class="error">{{ t("pin_locked") }}</p>{% elif error %}<p class="error">{{ t("pin_wrong") }}</p>{% endif %}
<form method="post" action="/pin" class="upload">
  <input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" required autofocus>
  <button type="submit">{{ t("pin_open") }}</button>
</form>
{% endblock %}
