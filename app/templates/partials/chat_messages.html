<ul class="messages">
{% for m in messages %}
  <li class="msg {{ 'me' if m.direction == 'in' else 'bot' }}">{{ m.body }}</li>
{% else %}
  <li class="msg bot">{{ t("chat_hello") }}</li>
{% endfor %}
</ul>
{% if notice %}<p class="notice">{{ notice }}</p>{% endif %}
{% if pending %}
<p class="muted typing">{{ t("chat_thinking") }}</p>
<div hx-get="/chat/messages" hx-trigger="load delay:2s" hx-target="#chat" hx-swap="innerHTML"></div>
{% endif %}
{% if gave_up %}<p class="notice">{{ t("chat_gave_up") }}</p>{% endif %}
{% if oob %}<button id="chat-send" type="submit" hx-swap-oob="true" {% if pending %}disabled{% endif %}>{{ t("chat_working") if pending else t("send") }}</button>{% endif %}
