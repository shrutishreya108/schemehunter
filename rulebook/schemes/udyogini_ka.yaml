id: udyogini_ka
name: { en: "Udyogini (Karnataka)", hi: "उद्योगिनी योजना (कर्नाटक)" }
aliases: ["Udyogini", "Udyogini scheme"]
level: state
state: KA
benefit:
  type: subsidy
  text: { en: "Loan up to ₹3 lakh with a subsidy: 30% general, 50% for SC/ST, widows and women with disabilities.",
          hi: "₹3 लाख तक का लोन, सब्सिडी के साथ: सामान्य 30%, SC/ST, विधवा और दिव्यांग महिलाओं के लिए 50%।" }
  max_loan: 300000
  verified: false
  source_note: "Curator public-rule list (v0.2 brief)"
apply_mode: office
status_mode: manual
# TODO(curator): authority, window, documents, source_pdf, page numbers (see BUILD_NOTES.md)

eligibility:
  all:
    - { id: woman, fact: gender, op: eq, value: female,
        verified: false, source_note: "Curator public-rule list (v0.2 brief)" }
    - id: age
      verified: false
      source_note: "Curator public-rule list (v0.2 brief): 18 to 55"
      all:
        - { fact: age, op: gte, value: 18 }
        - { fact: age, op: lte, value: 55 }
    - id: income_cap
      verified: false
      source_note: "Curator public-rule list (v0.2 brief): family income <= 1,50,000 unless SC/ST or widow/disabled"
      when:
        all:
          - { fact: category, op: not_in, value: [SC, ST] }
          - { fact: special_circumstance, op: not_in, value: [widow, disabled] }
      then: { fact: family_income, op: lte, value: 150000 }
    - { id: loan_cap, fact: loan_amount, op: lte, value: 300000,
        verified: false, source_note: "Curator public-rule list (v0.2 brief): loan up to 3,00,000" }

benefit_calc:
  subsidy_percent:
    - when: { fact: category, op: in, value: [SC, ST] }
      value: 50
      verified: false
      source_note: "Curator public-rule list (v0.2 brief): 50% for SC/ST"
    - when: { fact: special_circumstance, op: in, value: [widow, disabled] }
      value: 50
      verified: false
      source_note: "Curator public-rule list (v0.2 brief): 50% for special circumstances"
    - default: 30
      verified: false
      source_note: "Curator public-rule list (v0.2 brief): 30% general"
